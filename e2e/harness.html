<meta charset="utf-8">
<iframe id="f" src="../index.html?cumple" style="width:400px;height:800px"></iframe>
<script>
const log = m => fetch('/result?' + encodeURIComponent(m));
const f = document.getElementById('f');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const wait = (step, fn, ms = 120000) => new Promise((res, rej) => { const t0 = Date.now(); const i = setInterval(() => { const v = fn(); if (v) { clearInterval(i); res(v); } else if (Date.now() - t0 > ms) { clearInterval(i); rej(new Error(`timeout at ${step} after ${(Date.now() - t0) / 1000}s, status: ` + f.contentDocument.querySelector('#status')?.textContent)); } }, 250); });
const btn = (d, text) => [...d.querySelectorAll('.actions button')].find(b => b.textContent.startsWith(text));
const names = d => [...d.querySelectorAll('.tile .name')].map(n => n.textContent.replace(/ [♂♀]$/, '')); // without the gender mark
// A finger swipe on el, in steps (synthetic touch events).
async function swipe(w, el, dx, dy) {
  const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + Math.min(120, r.height / 2);
  const t = (cx, cy) => new w.Touch({ identifier: 1, target: el, clientX: cx, clientY: cy });
  const fire = (type, cx, cy) => el.dispatchEvent(new w.TouchEvent(type, { bubbles: true, cancelable: true, touches: type === 'touchend' ? [] : [t(cx, cy)], changedTouches: [t(cx, cy)] }));
  fire('touchstart', x, y);
  for (let i = 1; i <= 8; i++) { fire('touchmove', x + dx * i / 8, y + dy * i / 8); await sleep(16); }
  fire('touchend', x + dx, y + dy);
}
f.onload = async () => {
  f.onload = null;
  try {
    const d = f.contentDocument, w = f.contentWindow;
    // Headless Chrome has no position: fake one in Sitges so the real place lookup runs.
    w.navigator.geolocation.getCurrentPosition = ok => ok({ coords: { latitude: 41.2372, longitude: 1.8059 } });
    // The app asks with its own pop-up (#ask): answer yes when it opens.
    const yes = async step => { await wait(step, () => d.querySelector('#ask').open, 5000); d.querySelector('#ask .yes').click(); };

    // First open: the birthday surprise, then her two memories.
    await wait('birthday', () => !d.querySelector('#bday').hidden, 10000);
    const bday = d.querySelector('#bday h2').textContent;
    // Style guards (v0.13.0 lost a whole CSS block and the behaviour checks still passed):
    if (getComputedStyle(d.querySelector('#bday')).position !== 'fixed') throw new Error('birthday styles missing');
    d.querySelector('#bday button').click();
    await wait('memories', () => names(d).includes('Kurko') && names(d).includes('Kiffy'), 10000);
    await sleep(300);
    if (![...d.querySelectorAll('.tile')].every(t => t.querySelector('.pic img').src.startsWith('blob:'))) throw new Error('a tile has no sticker');
    const order = [...d.querySelectorAll('.tile')].slice(0, 2).map(t => t.querySelector('.no').textContent + ' ' + t.querySelector('.name').textContent).join(', '); // "#001 Kurko, #002 Kiffy"

    // A memory cannot be released.
    d.querySelector('.tile.memory').click();
    await wait('memory card', () => btn(d, '📷 Foto'));
    const memoryRelease = !!btn(d, '🕊️ Liberar');
    await sleep(700);
    await swipe(w, d.querySelector('.card'), 0, 200); // swipe down closes
    await wait('back', () => !d.querySelector('#list').hidden && d.querySelectorAll('.tile').length === 2);

    // Catch a cat.
    const blob = await (await fetch('cat.jpg')).blob();
    const dt = new DataTransfer(); dt.items.add(new File([blob], 'cat.jpg', { type: 'image/jpeg' }));
    const realRandom = w.Math.random;
    w.Math.random = () => 0.01; // force this catch to be shiny
    const input = d.querySelector('#file'); input.files = dt.files; input.dispatchEvent(new Event('change'));
    const keep = await wait('preview', () => btn(d, '¡Me lo quedo!') || (d.querySelector('#status').textContent.startsWith('Algo') && d.querySelector('#status')));
    if (!keep.onclick) throw new Error(keep.textContent);
    await wait('reveal', () => !d.querySelector('#card .cover'), 6000); // the booster-pack reveal
    w.Math.random = realRandom;
    const shinyToast = await wait('shiny toast', () => d.querySelector('#toast').textContent.includes('SHINY') && 'yes', 5000);
    const shinyCard = d.querySelector('.card').classList.contains('shiny');
    const where = d.querySelector('.where');
    await wait('place', () => !where.textContent.startsWith('Buscando'), 30000);
    const img = d.querySelector('.sticker'); await wait('sticker', () => img.complete && img.naturalWidth);
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0); const px = x.getImageData(0, 0, c.width, c.height).data;
    let clear = 0; for (let i = 3; i < px.length; i += 4) if (px[i] === 0) clear++;
    d.querySelector('.fav').click(); // favourite it
    // Gender: female → a female title on the untouched random name, traits in their feminine form, ♀ on the tile.
    const nameBefore = d.querySelector('.card .name').value;
    [...d.querySelectorAll('.gender button')].find(b => b.dataset.g === 'f').click();
    const nameAfter = d.querySelector('.card .name').value;
    const femTitle = /^(Doña|Capitana|Lady|Señorita|Pequeña|Princesa|Profe|Gran) /.test(nameAfter);
    const traitsNow = [...d.querySelectorAll('.traits input')].map(i => i.value).join(',');
    const info = `species=${d.querySelector('.species').value} sticker=${c.width}x${c.height} transparent=${(clear / (px.length / 4) * 100).toFixed(0)}% place=${where.textContent}`;
    keep.click();
    await wait('gallery', () => d.querySelectorAll('.tile').length === 3, 10000);
    const firstBadge = await wait('first badge toast', () => d.querySelector('#toast').textContent.includes('Primera captura') && d.querySelector('#toast').textContent.includes('shiny') && 'yes', 8000);
    const shinyTile = !!d.querySelector('.tile.shiny');
    // David's letters: first catch, shiny and favourite are all due now; open each one.
    const letters = [];
    for (;;) {
      const open = await wait('letter', () => d.querySelector('#letter').open, 4000).catch(() => null);
      if (!open) break;
      d.querySelector('#letter .envelope').click();
      await sleep(200);
      letters.push(d.querySelector('#letter .note-text').textContent.slice(0, 16));
      d.querySelector('#letter .close').click();
      await sleep(900);
    }
    d.querySelector('#open-letters').click();
    await sleep(300);
    const kept = d.querySelectorAll('#letters-list li').length;
    d.querySelector('#letters .close').click();
    await sleep(300);

    // Seen again from the card (no photo).
    [...d.querySelectorAll('.tile')].find(t => !t.classList.contains('memory')).click();
    await wait('cat card', () => btn(d, '👀'));
    btn(d, '👀').click();
    await wait('seen again', () => !d.querySelector('.card .bond').hidden && d.querySelector('.card .bond').textContent.includes('2 veces'), 15000);
    await sleep(600);
    await swipe(w, d.querySelector('.card'), 0, -200); // swipe up closes too
    await wait('back 2', () => !d.querySelector('#list').hidden, 5000);
    await sleep(600);

    // A second photo of the same cat: "Ya lo tenía" adds a visit instead of a new card.
    const dt2 = new DataTransfer(); dt2.items.add(new File([blob], 'cat2.jpg', { type: 'image/jpeg' })); // a FileList can be assigned only once
    input.files = dt2.files; input.dispatchEvent(new Event('change'));
    await wait('preview 2', () => btn(d, '🔁 Ya lo tenía'));
    await wait('reveal 2', () => !d.querySelector('#card .cover'), 6000);
    btn(d, '🔁 Ya lo tenía').click();
    await wait('picker', () => d.querySelector('.pick .tile'));
    d.querySelector('.pick .tile').click();
    await wait('visit 2', () => !d.querySelector('#list').hidden && d.querySelector('.tile:not(.memory) .meta').textContent.includes('👀3'), 15000);
    const loyal = await wait('loyal toast', () => d.querySelector('#toast').textContent.includes('Amiga fiel') && 'yes', 8000).catch(() => 'no');
    const noMarkOnTile = [...d.querySelectorAll('.tile .name')].some(n => n.textContent === nameAfter); // gender only on the back
    const hearts = [...d.querySelectorAll('.tile .heart')].filter(h => !h.hidden).length;
    d.querySelector('#tabs [data-tab=map]').click();
    await wait('map', () => d.querySelectorAll('.pin').length, 20000);
    const pins = d.querySelectorAll('.pin').length; // the catch, its 2 visits, and Kurko + Kiffy in Martos

    // Backup → restore round trip (the share sheet is replaced by a capture).
    let saved;
    w.navigator.canShare = () => true;
    w.navigator.share = async ({ files }) => { saved = await files[0].text(); };
    d.querySelector('#backup').click();
    await wait('backup', () => saved, 10000);
    const backup = JSON.parse(saved);
    backup.animals = backup.animals.filter(a => !a.memory).map(a => ({ ...a, id: 'restored', name: 'Restaurado' }));
    const rt = new DataTransfer(); rt.items.add(new File([JSON.stringify(backup)], 'copia.json', { type: 'application/json' }));
    const restore = d.querySelector('#restore'); restore.files = rt.files; restore.dispatchEvent(new Event('change'));
    await yes('ask restore');
    d.querySelector('#tabs [data-tab=grid]').click();
    await wait('restore', () => names(d).includes('Restaurado'), 10000);

    // Album: gato and perro caught (memories count too).
    d.querySelector('#tabs [data-tab=album]').click();
    if (getComputedStyle(d.querySelector('main')).viewTransitionName !== 'content') throw new Error('tab transition styles missing');
    await wait('album', () => !d.querySelector('#album').hidden && d.querySelectorAll('.slot').length, 10000);
    const album = d.querySelector('#album-progress').textContent;
    const badges = d.querySelector('#badges-title').textContent;

    // Rarity and traits: Kurko is legendary; flip his card, set a trait to 3 stars, add one.
    d.querySelector('#tabs [data-tab=grid]').click();
    await wait('grid again', () => !d.querySelector('#grid').hidden && names(d).includes('Kurko'), 10000);
    await sleep(800);
    [...d.querySelectorAll('.tile')].find(t => t.querySelector('.name').textContent.startsWith('Kurko')).click();
    await wait('kurko card', () => btn(d, '📷 Foto'));
    const rarity = d.querySelector('.card').dataset.rarity;
    await sleep(700);
    const hFront = d.querySelector('.card').offsetHeight;
    await swipe(w, d.querySelector('.card'), -150, 0); // sideways swipe flips
    await wait('flip', () => d.querySelector('.card.show-back'), 5000);
    await sleep(500);
    const sameHeight = d.querySelector('.card').offsetHeight === hFront;
    const before = d.querySelectorAll('.traits li').length;
    d.querySelectorAll('.traits li')[0].querySelectorAll('.star')[2].click();
    const traits = `${d.querySelectorAll('.traits li').length}${d.querySelector('.add-trait, .traits .drop') ? '+editable-count' : ''}`; // always 3, no add / ✕
    const oneRow = new Set([...d.querySelectorAll('.back-actions button')].map(b => Math.round(b.getBoundingClientRect().top))).size === 1;
    const stars = d.querySelectorAll('.traits li')[0].querySelectorAll('.star.on').length;
    d.querySelector('.back h3').click(); // a tap flips back too
    await wait('unflip', () => !d.querySelector('.card.show-back'), 5000);
    await sleep(500);
    await swipe(w, d.querySelector('.card .name'), 150, 0); // a swipe that starts on a text field flips too
    await wait('flip from input', () => d.querySelector('.card.show-back'), 5000);
    await sleep(500);
    // Closing while the back shows (it still does, from the swipe above): it turns to the front first, then shrinks.
    w.history.back();
    await wait('front before close', () => !d.querySelector('.card.show-back'), 3000);
    await wait('closed from back', () => !d.querySelector('#list').hidden, 5000);
    await sleep(600);
    [...d.querySelectorAll('.tile')].find(t => t.querySelector('.name').textContent.startsWith('Kurko')).click();
    await wait('kurko again', () => btn(d, '📷'));
    await sleep(500);
    w.history.back();
    await wait('back from kurko', () => !d.querySelector('#list').hidden, 5000);

    // Gallery import: the date comes from the photo (cat.jpg's EXIF says 31 Jan 2009); it has no GPS, so the
    // place is set by hand: search "Martos" in the picker, save.
    const dt3 = new DataTransfer(); dt3.items.add(new File([blob], 'gallery.jpg', { type: 'image/jpeg' }));
    const gal = d.querySelector('#gallery-file'); gal.files = dt3.files; gal.dispatchEvent(new Event('change'));
    await wait('gallery preview', () => btn(d, '¡Me lo quedo!'));
    await wait('reveal 3', () => !d.querySelector('#card .cover'), 6000);
    const galleryWhen = d.querySelector('.card .when').textContent;
    const hintGone = !d.querySelector('#card .swipe-hint'); // she has flipped and closed with swipes by now
    const noPlace = d.querySelector('.card .where').textContent;
    d.querySelector('.card .where').click();
    await wait('picker', () => d.querySelector('#locpick').open, 10000);
    d.querySelector('#loc-q').value = 'Martos, Jaén';
    d.querySelector('#loc-search button').click();
    await wait('search', () => d.querySelector('.loc-pin'), 15000);
    d.querySelector('#loc-ok').click();
    await wait('picked place', () => d.querySelector('.card .where').textContent.includes('Martos'), 15000);
    let gallery = `hintGone=${hintGone} when="${galleryWhen}" before="${noPlace}" after="${d.querySelector('.card .where').textContent}"`;
    // Re-cut with a box: drag a box around the cat, then tap it inside the zoomed area.
    const stickerBefore = d.querySelector('.card .sticker').src;
    btn(d, '✂️ Recortar otra vez').click();
    await wait('recut photo', () => d.querySelector('#stage .photo'), 5000);
    const pointer = (el, type, fx, fy) => { const r = el.getBoundingClientRect();
      el.dispatchEvent(new w.PointerEvent(type, { bubbles: true, pointerId: 7, clientX: r.left + r.width * fx, clientY: r.top + r.height * fy })); };
    let ph = d.querySelector('#stage .photo');
    pointer(ph, 'pointerdown', 0.12, 0.08); pointer(ph, 'pointermove', 0.5, 0.5); pointer(ph, 'pointermove', 0.92, 0.95); pointer(ph, 'pointerup', 0.92, 0.95);
    await wait('zoomed', () => d.querySelector('#stage .photo') && d.querySelector('#stage .photo') !== ph, 5000);
    ph = d.querySelector('#stage .photo');
    const zoomed = `${ph.width}x${ph.height}`;
    pointer(ph, 'pointerdown', 0.5, 0.45); pointer(ph, 'pointerup', 0.5, 0.45);
    await wait('recut preview', () => btn(d, '¡Me lo quedo!') && d.querySelector('.card .sticker').src !== stickerBefore, 20000);
    gallery += ` recutZoomed=${zoomed}`;
    btn(d, 'Descartar').click();
    await wait('discarded', () => !d.querySelector('#list').hidden, 5000);
    await sleep(500);

    const summary = `gallery[${gallery}] order="${order}" restoredNo=${[...d.querySelectorAll('.tile')].find(t => t.querySelector('.name').textContent.startsWith('Restaurado')).querySelector('.no').textContent}`;

    // Reset: everything goes, the app starts like the first day (birthday, only Kurko and Kiffy).
    w.localStorage.setItem('sitges26:other-app', 'keep me'); // another app on the same origin
    const reloaded = new Promise(r => f.addEventListener('load', r, { once: true }));
    d.querySelector('#reset').click();
    await yes('ask reset 1');
    await sleep(300);
    await yes('ask reset 2');
    await reloaded;
    const d2 = f.contentDocument;
    await wait('memories after reset', () => d2.querySelectorAll('.tile').length === 2, 10000);
    // In a browser tab (not the installed app) the greeting stays hidden, and it was not marked as seen.
    const reset = `${names(d2).join('+')},greetingInTab=${!d2.querySelector('#bday').hidden},seenFlag=${f.contentWindow.localStorage.getItem('bday-seen')},otherApp=${f.contentWindow.localStorage.getItem('sitges26:other-app')}`;

    log(`OK letters=[${letters.join(' | ')}] kept=${kept} gender[${nameBefore} → ${nameAfter} femTitle=${femTitle} noMarkOnTile=${noMarkOnTile} traits=${traitsNow}] reset=${reset} ${summary} shiny=${shinyToast}/${shinyCard}/${shinyTile} closeFromBack=ok swipes=ok swipeFromInput=ok sameHeight=${sameHeight} firstBadge=${firstBadge} loyal=${loyal} badges="${badges}" album="${album}" rarity=${rarity} traits=${before}=${traits} oneRow=${oneRow} stars=${stars} bday="${bday}" ${info} memories=${names(d).filter(n => n === 'Kurko' || n === 'Kiffy').length} memoryRelease=${memoryRelease} hearts=${hearts} pins=${pins} backup=${JSON.parse(saved).animals.length} tiles=${d.querySelectorAll('.tile').length}`);
    document.title = 'done';
  } catch (e) { log('FAIL ' + e.message); }
};
</script>
