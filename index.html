<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7d98b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pet Catcher">
  <title>Pet Catcher</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <script src="version.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>Pet Catcher <span class="sparkle">✿</span></h1>
    <p class="tagline">¡atrápalos a todos! <span id="count"></span></p>
    <nav id="tabs">
      <button data-tab="grid">🗂️ Colección</button>
      <button data-tab="album">📖 Álbum</button>
      <button data-tab="map">🗺️ Mapa</button>
    </nav>
  </header>

  <main>
    <section id="list">
      <nav id="filters" hidden></nav>
      <div id="empty" hidden>
        <p class="kaomoji">(｡•ᴗ•｡)</p>
        <p>Todavía no has atrapado ningún bichito.<br>¡Sal a buscar uno!</p>
      </div>
      <div id="grid"></div>
      <div id="album" hidden>
        <div class="progress"><span id="album-progress"></span><div id="album-bar"></div></div>
        <div id="album-grid"></div>
        <h3 id="badges-title"></h3>
        <div id="badges"></div>
      </div>
      <div id="map-wrap" hidden>
        <div id="map"></div>
        <p id="map-empty" hidden>Aún no hay capturas con ubicación (・_・;)</p>
      </div>
    </section>

    <section id="view" hidden>
      <p id="status" hidden></p>
      <div id="stage"></div>
      <div id="card"></div>
    </section>
  </main>

  <footer id="footer"><button id="open-settings">⚙️ Ajustes</button> · <span id="version"></span></footer>

  <dialog id="settings">
    <h2>⚙️ Ajustes</h2>
    <p class="hint">Tus bichitos solo viven en este móvil. Guarda una copia de vez en cuando 💛</p>
    <button id="backup">💾 Guardar copia</button>
    <label class="restore">📂 Restaurar una copia<input id="restore" type="file" accept="application/json,.json" hidden></label>
    <button id="replay-bday">🎂 Ver la felicitación</button>
    <p id="settings-version" class="hint"></p>
    <form method="dialog"><button class="close" autofocus>Cerrar</button></form>
  </dialog>

  <input id="refile" type="file" accept="image/*" capture="environment" hidden>
  <div id="toast" role="status" hidden></div>
  <div id="burst" class="confetti once" aria-hidden="true"></div>

  <div id="bday" hidden>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <div class="bday-card">
      <p class="bday-cake">🎂</p>
      <h2>¡Feliz cumpleaños Mari!</h2>
      <p class="bday-love">Te quiero ❤️</p>
      <button>¡A cazar bichitos! 🐾</button>
    </div>
  </div>

  <label id="shoot" class="fab">📸 ¡Atrapar!
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
  </label>

  <datalist id="species-list"></datalist>
  <datalist id="traits-list"></datalist>

  <template id="tile-tpl">
    <button class="tile"><span class="ribbon">Recuerdo</span><span class="heart" hidden>❤️</span><span class="pic"><img alt=""></span><span class="name"></span><span class="meta"></span></button>
  </template>

  <template id="badge-tpl">
    <div class="badge"><span class="emoji"></span><span class="title"></span><span class="desc"></span></div>
  </template>

  <template id="slot-tpl">
    <button class="slot"><img alt=""><span class="emoji"></span><span class="label"></span><span class="n"></span></button>
  </template>

  <template id="card-tpl">
    <article class="card">
      <div class="sticker-wrap"><img class="sticker" alt=""><span class="ribbon">Recuerdo</span></div>
      <button class="fav" aria-label="Favorito"></button>
      <input class="name" maxlength="40" aria-label="Nombre" autocomplete="off">
      <label class="species-row">
        <span class="emoji" aria-hidden="true"></span>
        <input class="species" list="species-list" maxlength="30" aria-label="Especie" autocomplete="off">
      </label>
      <p class="rarity"></p>
      <p class="when"></p>
      <p class="where"></p>
      <p class="seen"></p>
      <div class="actions"></div>
      <div class="back">
        <h3></h3>
        <ul class="traits"></ul>
        <button class="add-trait">＋ Añadir rasgo</button>
        <textarea class="note" rows="3" maxlength="300" placeholder="Escribe una nota… ✏️"></textarea>
      </div>
    </article>
  </template>
</body>
</html>
