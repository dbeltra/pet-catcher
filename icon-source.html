<!doctype html>
<!-- Source of icon-512.png (icon-192.png is scaled from it; see CLAUDE.md "Regenerate the PNG icons").
     David's open-book icon (v0.15), redrawn as SVG in the app's colours. The book stays inside the middle 80%,
     the safe zone of a maskable icon. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body { background: #fffdf5; } /* the page background (--bg) */
  svg { display: block; width: 100vw; height: 100vw; }
</style>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

    <!-- four-point sparkle centred on 0,0 -->
    <path id="spark" d="M0-32 Q4-4 32 0 Q4 4 0 32 Q-4 4-32 0 Q-4-4 0-32Z"/>
    <!-- the page shapes, so the inner shadows follow the page tops instead of sticking out above them -->
    <clipPath id="left-page"><path d="M243 212 Q352 172 466 214 L466 512 Q352 476 243 512Z"/></clipPath>
    <clipPath id="right-page"><path d="M466 214 Q580 172 690 212 L690 512 Q580 476 466 512Z"/></clipPath>
  </defs>
  <!-- drawn in the original's coordinates (book 213..722 × 180..600, centre 467,390), centred and scaled so its
       corners stay inside the maskable safe circle -->
  <g transform="translate(256 256) scale(.6) translate(-467.5 -390)" stroke-linejoin="round">
    <!-- cover -->
    <path fill="#f7d98b" d="M213 272 Q213 252 236 250 L700 250 Q722 252 722 272 L722 578 Q722 602 698 598

    <path fill="#f8f9fb" d="M466 214 Q580 172 690 212 L690 512 Q580 476 466 512Z"/>

      Q562 520 466 556 Q372 520 262 553 Q243 552 243 534Z"/>

      <path d="M282 243 Q356 220 428 238"/>
      <path d="M282 278 Q356 256 428 273"/>
      <path d="M282 315 Q356 293 428 310"/>
      <path d="M508 372 Q582 354 652 378"/>
      <path d="M508 407 Q582 389 652 413"/>
      <path d="M508 445 Q582 427 652 451"/>

    <!-- sparkles on the pages -->
    <use href="#spark" fill="#f5c84c" transform="translate(580 279)"/>
    <use href="#spark" fill="#f5c84c" transform="translate(354 397)"/>
  </g>
</svg>
