<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f855a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pet Catcher">
  <title>Pet Catcher</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header><h1>Pet Catcher</h1><span id="count"></span></header>

  <main>
    <section id="list">
      <p id="empty" hidden>No animals yet. Go catch one!</p>
      <div id="grid"></div>
    </section>

    <section id="view" hidden>
      <p id="status" hidden></p>
      <div id="stage"></div>
      <div id="card"></div>
    </section>
  </main>

  <label id="shoot" class="fab">📷 Catch
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
  </label>

  <template id="tile-tpl">
    <button class="tile"><img alt=""><span class="name"></span><span class="meta"></span></button>
  </template>

  <template id="card-tpl">
    <article class="card">
      <img class="sticker" alt="">
      <input class="name" maxlength="40" aria-label="Name" autocomplete="off">
      <p class="species"></p>
      <p class="when"></p>
      <p class="where"></p>
      <div class="actions"></div>
    </article>
  </template>
</body>
</html>
